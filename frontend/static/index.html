<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plant Catalog Assistant</title>
<!-- Optional: Material Symbols Outlined for icons -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #15803d;
    --accent-hover: #16a34a;
    --accent-light: #f0fdf4;
    --bg: #f0f4f1;
    --shell-bg: #ffffff;
    --log-bg: #f8faf7;
    --border: #e2e8f0;
    --card-bg: #ffffff;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --user-bubble-bg: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
    --agent-bubble-bg: #ffffff;
    --agent-bubble-border: #e2e8f0;
    --shadow: 0 15px 35px -10px rgba(21, 128, 61, 0.15), 0 5px 15px rgba(0, 0, 0, 0.04);
  }

  [data-theme="dark"] {
    --accent: #22c55e;
    --accent-hover: #4ade80;
    --accent-light: #14532d;
    --bg: #09120c;
    --shell-bg: #101e15;
    --log-bg: #0c1811;
    --border: #1e3a29;
    --card-bg: #15281b;
    --text-primary: #f0fdf4;
    --text-secondary: #94a3b8;
    --user-bubble-bg: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
    --agent-bubble-bg: #15281b;
    --agent-bubble-border: #1e3a29;
    --shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: var(--text-primary);
    transition: background 0.3s ease, color 0.3s ease;
  }

  /* Main Shell Card */
  #app-shell {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 860px;
    height: calc(100vh - 2.5rem);
    background: var(--shell-bg);
    border-radius: 20px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    overflow: hidden;
    position: relative;
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  /* Header Bar */
  header {
    background: linear-gradient(135deg, #15803d 0%, #166534 100%);
    color: #ffffff;
    padding: 0.9rem 1.4rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    z-index: 10;
  }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .header-icon {
    font-size: 1.5rem;
    background: rgba(255, 255, 255, 0.18);
    padding: 0.3rem 0.5rem;
    border-radius: 12px;
    line-height: 1;
  }
  .header-title {
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: -0.01em;
  }
  .header-subtitle {
    font-size: 0.76rem;
    opacity: 0.88;
    font-weight: 400;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .icon-btn {
    background: rgba(255, 255, 255, 0.18);
    border: none;
    color: #ffffff;
    padding: 0.4rem 0.7rem;
    border-radius: 12px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.3rem;
    transition: background 0.2s, transform 0.15s;
  }
  .icon-btn:hover {
    background: rgba(255, 255, 255, 0.3);
    transform: translateY(-1px);
  }

  /* Dialogue Stream */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.25rem 1.5rem;
    background: var(--log-bg);
    display: flex;
    flex-direction: column;
    gap: 1rem;
    scroll-behavior: smooth;
    transition: background 0.3s ease;
  }

  /* Dialogue Turn */
  .msg {
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    max-width: 88%;
  }
  .msg.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }
  .msg.agent {
    align-self: flex-start;
  }

  /* Avatars */
  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
  }
  .msg.agent .avatar {
    background: var(--accent-light);
    border: 1px solid var(--border);
    color: var(--accent);
  }
  .msg.user .avatar {
    background: var(--accent);
    color: #ffffff;
  }

  /* Speech Bubbles */
  .bubble-wrapper {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    position: relative;
  }
  .sender-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    padding: 0 0.25rem;
  }
  .sender-label {
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .copy-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 0.72rem;
    cursor: pointer;
    padding: 0.1rem 0.3rem;
    border-radius: 4px;
    opacity: 0.7;
    transition: opacity 0.2s, color 0.2s;
  }
  .copy-btn:hover {
    opacity: 1;
    color: var(--accent);
  }
  .bubble {
    padding: 0.75rem 1.1rem;
    font-size: 0.96rem;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.agent .bubble {
    background: var(--agent-bubble-bg);
    color: var(--text-primary);
    border: 1px solid var(--agent-bubble-border);
    border-radius: 4px 18px 18px 18px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
  }
  .msg.user .bubble {
    background: var(--user-bubble-bg);
    color: #ffffff;
    border-radius: 18px 4px 18px 18px;
    box-shadow: 0 3px 10px rgba(21, 128, 61, 0.22);
  }
  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    box-shadow: none;
    white-space: normal;
  }

  /* Collapsible Tool / Reasoning Accordion */
  .reasoning-accordion {
    margin-bottom: 0.4rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card-bg);
    overflow: hidden;
  }
  .reasoning-summary {
    padding: 0.4rem 0.75rem;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    background: rgba(0, 0, 0, 0.02);
  }
  .reasoning-summary:hover {
    color: var(--accent);
  }
  .reasoning-body {
    padding: 0.5rem 0.75rem;
    font-size: 0.82rem;
    color: var(--text-secondary);
    border-top: 1px solid var(--border);
    line-height: 1.4;
    font-family: monospace;
  }

  /* Animated Typing Indicator */
  .typing-dots {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 0.5rem 0.2rem;
  }
  .typing-dot {
    width: 7px;
    height: 7px;
    background: var(--accent);
    border-radius: 50%;
    animation: typing 1.4s infinite ease-in-out;
  }
  .typing-dot:nth-child(1) { animation-delay: 0s; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* Example Prompts Bar */
  #examples {
    display: flex;
    gap: 0.5rem;
    padding: 0.75rem 1.25rem 0;
    flex-wrap: wrap;
    justify-content: center;
    background: var(--shell-bg);
    border-top: 1px solid var(--border);
  }
  .chip {
    background: var(--log-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 0.45rem 0.9rem;
    font-size: 0.82rem;
    color: var(--text-secondary);
    cursor: pointer;
    font-weight: 500;
    transition: all 0.2s ease;
  }
  .chip:hover {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(21, 128, 61, 0.25);
  }

  /* Form & Input Bar */
  form {
    display: flex;
    gap: 0.6rem;
    padding: 1rem 1.25rem;
    background: var(--shell-bg);
    border-top: 1px solid var(--border);
  }
  input {
    flex: 1;
    padding: 0.8rem 1.1rem;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 0.98rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    background: var(--log-bg);
    color: var(--text-primary);
  }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18);
    background: var(--shell-bg);
  }
  button {
    padding: 0.8rem 1.4rem;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
    color: #ffffff;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 3px 8px rgba(21, 128, 61, 0.25);
  }
  button:hover {
    transform: translateY(-1px);
    box-shadow: 0 5px 12px rgba(21, 128, 61, 0.35);
  }

  /* A2UI Component Styles */
  .a2card { border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem; background: var(--card-bg); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); max-width: 100%; color: var(--text-primary); }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.6rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.45; }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; color: var(--accent); }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; color: var(--accent); }
  .a2text.a2-h4 { font-size: 0.98rem; font-weight: 600; }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-secondary); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.5rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 10px; display: block; box-shadow: 0 2px 6px rgba(0,0,0,0.08); cursor: pointer; transition: transform 0.2s ease; }
  .a2img:hover { transform: scale(1.02); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent); }

  /* Lightbox Modal */
  .lightbox-overlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(8px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    cursor: zoom-out;
    animation: fadeIn 0.2s ease;
  }
  .lightbox-overlay.active { display: flex; }
  .lightbox-img {
    max-width: 90vw;
    max-height: 88vh;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    object-fit: contain;
    cursor: default;
  }
  .lightbox-close {
    position: absolute;
    top: 20px; right: 25px;
    color: #ffffff;
    font-size: 2rem;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

<div id="app-shell">
  <header>
    <div class="header-brand">
      <div class="header-icon">🌱</div>
      <div>
        <div class="header-title">Plant Catalog Assistant</div>
        <div class="header-subtitle">AI-Powered Botanical Companion</div>
      </div>
    </div>
    <div class="header-actions">
      <button type="button" class="icon-btn" id="theme-btn" title="Toggle Dark/Light Mode">🌙</button>
      <button type="button" class="icon-btn" id="reset-btn" title="Clear Chat & Reset Session">🔄 Clear</button>
    </div>
  </header>

  <div id="log"></div>

  <div id="examples">
    <button type="button" class="chip" data-prompt="List all plants in the catalog">🌱 List all plants</button>
    <button type="button" class="chip" data-prompt="What is the taxonomy of Monstera deliciosa?">🔬 Plant taxonomy</button>
    <button type="button" class="chip" data-prompt="What's the weather in London?">🌤️ London weather</button>
  </div>

  <form id="form">
    <input id="input" placeholder="Ask about plants, weather, catalog items..." autocomplete="off" autofocus>
    <button>Send <span>➤</span></button>
  </form>
</div>

<!-- Image Lightbox Modal -->
<div id="lightbox" class="lightbox-overlay">
  <span class="lightbox-close" id="lightbox-close">&times;</span>
  <img id="lightbox-img" class="lightbox-img" src="" alt="Enlarged preview">
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const resetBtn = document.getElementById("reset-btn");
const themeBtn = document.getElementById("theme-btn");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const lightboxClose = document.getElementById("lightbox-close");

// --- Feature 5: Dark Mode Toggle ---
const savedTheme = localStorage.getItem("theme") || "light";
document.documentElement.setAttribute("data-theme", savedTheme);
themeBtn.textContent = savedTheme === "dark" ? "☀️" : "🌙";

themeBtn.addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme");
  const next = current === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("theme", next);
  themeBtn.textContent = next === "dark" ? "☀️" : "🌙";
});

// --- Feature 1: Reset / Clear Chat ---
resetBtn.addEventListener("click", async () => {
  try { await fetch("/reset", { method: "POST" }); } catch (e) {}
  log.innerHTML = "";
  input.value = "";
  const toast = bubble("agent");
  toast.textContent = "Chat history cleared & session reset. How can I help you today?";
});

// --- Feature 2: Lightbox Modal ---
function openLightbox(src) {
  lightboxImg.src = src;
  lightbox.classList.add("active");
}
lightbox.addEventListener("click", (e) => {
  if (e.target === lightbox || e.target === lightboxClose) {
    lightbox.classList.remove("active");
  }
});

// Example Chips
document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => {
    input.value = chip.dataset.prompt;
    if (form.requestSubmit) { form.requestSubmit(); } else { form.dispatchEvent(new Event("submit", { cancelable: true })); }
  });
});

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

// --- Feature 4: Copy to Clipboard ---
function bubble(who) {
  const m = el("div", "msg " + who);
  const avatar = el("div", "avatar", who === "user" ? "👤" : "🪴");
  
  const wrapper = el("div", "bubble-wrapper");
  const header = el("div", "sender-header");
  const label = el("div", "sender-label", who === "user" ? "You" : "Plant Assistant");
  
  header.appendChild(label);
  
  if (who === "agent") {
    const copyBtn = el("button", "copy-btn", "📋 Copy");
    copyBtn.type = "button";
    copyBtn.addEventListener("click", () => {
      const textToCopy = wrapper.querySelector(".bubble").innerText || "";
      navigator.clipboard.writeText(textToCopy);
      copyBtn.textContent = "✓ Copied!";
      setTimeout(() => { copyBtn.textContent = "📋 Copy"; }, 2000);
    });
    header.appendChild(copyBtn);
  }
  
  const b = el("div", "bubble");
  
  wrapper.appendChild(header);
  wrapper.appendChild(b);
  
  m.appendChild(avatar);
  m.appendChild(wrapper);
  
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

// --- Feature 3: Collapsible Tool Call / Reasoning Accordion ---
function addReasoningAccordion(container, toolInfoText) {
  const accordion = el("details", "reasoning-accordion");
  const summary = el("summary", "reasoning-summary", "⚙️ Reasoning & Tools (" + (toolInfoText ? "1" : "0") + ")");
  const body = el("div", "reasoning-body", toolInfoText || "Processed tools and retrieved catalog data.");
  accordion.appendChild(summary);
  accordion.appendChild(body);
  container.appendChild(accordion);
}

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img");
      img.src = src;
      img.alt = boundStr(props.alt) || "";
      img.addEventListener("click", () => openLightbox(src));
      return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  
  const b = bubble("agent");
  b.innerHTML = '<div class="typing-dots"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
  
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
